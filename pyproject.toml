[project]
name = "videotoinfo"
version = "0.1.0"
description = "Video ve yazı linklerinden yerel modellerle Türkçe özet ve Obsidian notu üretir."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ddgs>=9.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langfuse>=5,<6",
    "mlx-whisper>=0.4.3",
    "ollama>=0.6.3",
    "pyyaml>=6.0.2",
    "trafilatura>=2.0.0",
    "typer>=0.12.0",
    "uvicorn>=0.30.0",
    "yt-dlp>=2025.1.1",
]

[project.scripts]
vti = "videotoinfo.cli:app"

[dependency-groups]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videotoinfo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not integration'"
markers = [
    "integration: yerel model, ağ veya ses gerektirir",
]
